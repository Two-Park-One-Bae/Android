org.gradle.jvmargs=-Dfile.encoding=UTF-8 -XX:+UseG1GC -XX:+HeapDumpOnOutOfMemoryError -Xmx4g
kotlin.daemon.jvmargs=-Dfile.encoding=UTF-8 -XX:+UseG1GC -Xmx4g
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn
android.useAndroidX=true
kotlin.code.style=official

# 번들에 기기그룹(`system-on-chip`) 타깃팅을 넣는 API. **아직 베타**라 experimental 이다.
# 이게 없으면 app/src/main/device_targeting_configuration.xml 을 AGP 가 무시하고,
# `:qnn` 모듈이 조건 없이 전 기기에 설치된다 — 180MB 가 그대로 들어간다.
android.experimental.enableDeviceTargetingConfigApi=true
