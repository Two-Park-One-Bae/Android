name: CI

on:
  # ⚠️ base 를 main·develop 으로 좁히지 않는다. 스택 PR 은 base 가 feature 브랜치라
  #    그 필터에 걸려 **한 번도 돌지 않는다** — 실제로 #9·#10·#12·#13 이 검증 없이
  #    올라가 있었다. 스택 아래가 머지되며 base 가 develop 으로 바뀔 때야 처음 도는데,
  #    그때는 이미 리뷰가 끝난 뒤다.
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        # spec 서브모듈은 빌드에 불필요 — private 서브모듈 토큰 이슈 회피를 위해 미체크아웃

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      - name: secrets.properties 생성
        run: |
          printf 'BASE_URL_DEBUG=%s\nBASE_URL_RELEASE=%s\n' \
            "${{ secrets.BASE_URL_DEV }}" "${{ secrets.BASE_URL_PROD }}" > secrets.properties

      - name: 포맷·정적분석·린트·단위테스트
        run: ./gradlew spotlessCheck detekt lint testDebugUnitTest --console=plain

      - name: 빌드
        run: ./gradlew assembleDebug --console=plain
