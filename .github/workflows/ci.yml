name: CI

on:
  # ⚠️ base 를 main·develop 으로 좁히지 않는다. 스택 PR 은 base 가 feature 브랜치라
  #    그 필터에 걸려 **한 번도 돌지 않는다** — 실제로 #9·#10·#12·#13 이 검증 없이
  #    올라가 있었다. 스택 아래가 머지되며 base 가 develop 으로 바뀔 때야 처음 도는데,
  #    그때는 이미 리뷰가 끝난 뒤다.
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        # spec 서브모듈은 빌드에 불필요 — private 서브모듈 토큰 이슈 회피를 위해 미체크아웃

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      - name: secrets.properties 생성
        run: |
          printf 'BASE_URL_DEBUG=%s\nBASE_URL_RELEASE=%s\n' \
            "${{ secrets.BASE_URL_DEV }}" "${{ secrets.BASE_URL_PROD }}" > secrets.properties

      # ⚠️ debug·release 를 **각각** 만든다. 플러그인이 파일 안의 패키지명을 검증하는데
      #    debug 는 app.nursemate.debug, release 는 app.nursemate 라 한 파일을 복사해
      #    쓰면 빌드가 죽는다. 파일이 아예 없어도 하드 실패한다(플러그인 기본 동작).
      - name: google-services.json 생성
        env:
          GS_DEBUG: ${{ secrets.GOOGLE_SERVICES_JSON_DEBUG }}
          GS_RELEASE: ${{ secrets.GOOGLE_SERVICES_JSON_RELEASE }}
        run: |
          mkdir -p app/src/debug app/src/release
          printf '%s' "$GS_DEBUG"   | base64 -d > app/src/debug/google-services.json
          printf '%s' "$GS_RELEASE" | base64 -d > app/src/release/google-services.json

      - name: 포맷·정적분석·린트·단위테스트
        # ⚠️ `testDebugUnitTest` 가 아니라 `test` 다. 전자는 안드로이드 모듈에만 있는 태스크라
        # JVM 모듈인 :core:model 을 통째로 건너뛴다 — 도메인 계약 테스트 59개가 그렇게
        # 한 번도 안 돌았고, 컴파일조차 안 되는 테스트가 머지된 적이 있다.
        run: ./gradlew spotlessCheck detekt lint test --console=plain

      - name: 빌드
        run: ./gradlew assembleDebug --console=plain
