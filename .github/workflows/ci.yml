name: CI

on:
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        # spec 서브모듈은 빌드에 불필요 — private 서브모듈 토큰 이슈 회피를 위해 미체크아웃

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      - name: secrets.properties 생성
        run: |
          printf 'BASE_URL_DEBUG=%s\nBASE_URL_RELEASE=%s\n' \
            "${{ secrets.BASE_URL_DEV }}" "${{ secrets.BASE_URL_PROD }}" > secrets.properties

      - name: 포맷·정적분석·린트·단위테스트
        run: ./gradlew spotlessCheck detekt lint testDebugUnitTest --console=plain

      - name: 빌드
        run: ./gradlew assembleDebug --console=plain
