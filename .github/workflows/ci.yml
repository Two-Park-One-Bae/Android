name: CI

on:
  # ⚠️ base 를 main·develop 으로 좁히지 않는다. 스택 PR 은 base 가 feature 브랜치라
  #    그 필터에 걸려 **한 번도 돌지 않는다** — 실제로 #9·#10·#12·#13 이 검증 없이
  #    올라가 있었다. 스택 아래가 머지되며 base 가 develop 으로 바뀔 때야 처음 도는데,
  #    그때는 이미 리뷰가 끝난 뒤다.
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        # spec 서브모듈은 빌드에 불필요 — private 서브모듈 토큰 이슈 회피를 위해 미체크아웃

      - name: 빌드 환경 (JDK · Gradle · secrets · google-services)
        uses: ./.github/actions/setup-android
        with:
          base-url-dev: ${{ secrets.BASE_URL_DEV }}
          base-url-prod: ${{ secrets.BASE_URL_PROD }}
          google-services-debug: ${{ secrets.GOOGLE_SERVICES_JSON_DEBUG }}
          google-services-release: ${{ secrets.GOOGLE_SERVICES_JSON_RELEASE }}

      - name: 포맷·정적분석·린트·단위테스트
        # ⚠️ `testDebugUnitTest` 가 아니라 `test` 다. 전자는 안드로이드 모듈에만 있는 태스크라
        # JVM 모듈인 :core:model 을 통째로 건너뛴다 — 도메인 계약 테스트 59개가 그렇게
        # 한 번도 안 돌았고, 컴파일조차 안 되는 테스트가 머지된 적이 있다.
        run: ./gradlew spotlessCheck detekt lint test --console=plain

      - name: 빌드
        run: ./gradlew assembleDebug --console=plain
