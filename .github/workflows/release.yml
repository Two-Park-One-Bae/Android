name: Release AAB

# 수동 실행(workflow_dispatch) 또는 v* 태그 푸시 시 서명된 AAB를 산출한다.
# 필요한 Secrets: BASE_URL_DEV · BASE_URL_PROD · RELEASE_KEYSTORE_BASE64 · RELEASE_STORE_PASSWORD · RELEASE_KEY_ALIAS · RELEASE_KEY_PASSWORD
on:
  workflow_dispatch:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        # spec 서브모듈은 빌드에 불필요 — private 서브모듈 토큰 이슈 회피를 위해 미체크아웃

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      - name: keystore 복원
        run: printf '%s' "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/upload.jks"

      - name: secrets.properties 생성
        run: |
          cat > secrets.properties <<EOF
          BASE_URL_DEBUG=${{ secrets.BASE_URL_DEV }}
          BASE_URL_RELEASE=${{ secrets.BASE_URL_PROD }}
          RELEASE_STORE_FILE=$RUNNER_TEMP/upload.jks
          RELEASE_STORE_PASSWORD=${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS=${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD=${{ secrets.RELEASE_KEY_PASSWORD }}
          EOF

      - name: 서명된 AAB 빌드
        run: ./gradlew :app:bundleRelease --console=plain

      - name: 서명 검증
        run: jarsigner -verify app/build/outputs/bundle/release/app-release.aab

      - name: AAB 아티팩트 업로드
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: R8 매핑 업로드 (Play Console 난독화 해제용)
        uses: actions/upload-artifact@v4
        with:
          name: app-release-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
