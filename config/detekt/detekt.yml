# detekt 설정 — 기본 규칙(buildUponDefaultConfig) 위에 최소 오버라이드만.
build:
  maxIssues: 0

naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']

complexity:
  LongMethod:
    ignoreAnnotated: ['Composable']
  LongParameterList:
    ignoreAnnotated: ['Composable']

style:
  MagicNumber:
    active: false
  UnusedPrivateMember:
    ignoreAnnotated: ['Composable', 'Preview']
