[versions]
# 빌드 도구 — Now in Android(main, AGP 9) 검증 조합 기준. 함께 올릴 것.
agp = "9.3.0"
kotlin = "2.3.0"
ksp = "2.3.4"

# AndroidX / Compose
composeBom = "2026.08.00"
androidxActivity = "1.9.3"
androidxCoreKtx = "1.15.0"
androidxLifecycle = "2.10.0"
androidxDataStore = "1.2.0"
androidxHiltViewModelCompose = "1.4.0"
androidxNavigation = "2.10.0"
androidxCamera = "1.6.2"

# Wear (Compose BOM 미포함 — 직접 버전 관리. M2.5 compose-material 금지, material3 사용)
wearCompose = "1.6.2"
# 진행 중 표시(Ongoing Activity) — Wear 품질요건 WO-V4. Compose BOM 과 별개 릴리스다.
wearOngoing = "1.1.0"
wearTiles = "1.6.2"
wearProtolayout = "1.4.2"
playServicesWearable = "20.0.1"

# DI / 네트워크 / 직렬화
hilt = "2.59"
retrofit = "2.11.0"
retrofitKotlinxSerialization = "1.0.0"
okhttp = "4.12.0"
kotlinxSerializationJson = "1.8.0"
kotlinxCoroutines = "1.10.1"

# 인증 (NM-407) — Firebase Auth + Credential Manager
firebaseBom = "34.18.0"
googleServices = "4.5.0"

# 크래시·지표 (NM-466) — 플러그인만 버전을 적는다. 라이브러리는 BOM 이 맞춘다.
firebaseCrashlyticsPlugin = "3.0.8"
androidxCredentials = "1.6.0"
googleid = "1.2.0"
kakaoSdk = "2.25.0"

# 낱알 이미지 로딩
coil = "3.3.0"

# 온디바이스 검출 (core:vision)
onnxruntime = "1.22.0"
opencv = "4.11.0"
androidxExifInterface = "1.4.1"

# 테스트
junit = "4.13.2"
kotlinTest = "2.3.0"

# 코드 품질
spotless = "8.10.0"
detekt = "1.23.8"
ktlint = "1.8.0"

[libraries]
# build-logic 전용 (convention plugin 컴파일 클래스패스)
android-gradlePlugin = { group = "com.android.tools.build", name = "gradle-api", version.ref = "agp" }
kotlin-gradlePlugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }

androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "androidxCoreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "androidxActivity" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "androidxLifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "androidxLifecycle" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "androidxDataStore" }
androidx-hilt-lifecycle-viewmodel-compose = { group = "androidx.hilt", name = "hilt-lifecycle-viewmodel-compose", version.ref = "androidxHiltViewModelCompose" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "androidxNavigation" }

# 앱 내 카메라 촬영 화면. 디자인 정본이 전체화면 뷰파인더(가이드 사각형·셔터)를 요구해서
# 시스템 카메라 위임으로는 만들 수 없다 — spec/design/DESIGN.pen "① 촬영 (카메라)"
androidx-camera-core = { group = "androidx.camera", name = "camera-core", version.ref = "androidxCamera" }
androidx-camera-camera2 = { group = "androidx.camera", name = "camera-camera2", version.ref = "androidxCamera" }
androidx-camera-lifecycle = { group = "androidx.camera", name = "camera-lifecycle", version.ref = "androidxCamera" }
androidx-camera-view = { group = "androidx.camera", name = "camera-view", version.ref = "androidxCamera" }

androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }

wear-ongoing = { group = "androidx.wear", name = "wear-ongoing", version.ref = "wearOngoing" }
wear-tiles = { group = "androidx.wear.tiles", name = "tiles", version.ref = "wearTiles" }
wear-protolayout = { group = "androidx.wear.protolayout", name = "protolayout", version.ref = "wearProtolayout" }
wear-protolayout-expression = { group = "androidx.wear.protolayout", name = "protolayout-expression", version.ref = "wearProtolayout" }
wear-protolayout-material3 = { group = "androidx.wear.protolayout", name = "protolayout-material3", version.ref = "wearProtolayout" }
wear-compose-material3 = { group = "androidx.wear.compose", name = "compose-material3", version.ref = "wearCompose" }
wear-compose-foundation = { group = "androidx.wear.compose", name = "compose-foundation", version.ref = "wearCompose" }
wear-compose-navigation = { group = "androidx.wear.compose", name = "compose-navigation", version.ref = "wearCompose" }
play-services-wearable = { group = "com.google.android.gms", name = "play-services-wearable", version.ref = "playServicesWearable" }

hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
hilt-core = { group = "com.google.dagger", name = "hilt-core", version.ref = "hilt" }
kotlin-metadata = { group = "org.jetbrains.kotlin", name = "kotlin-metadata-jvm", version.ref = "kotlin" }

retrofit-core = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-kotlinx-serialization = { group = "com.jakewharton.retrofit", name = "retrofit2-kotlinx-serialization-converter", version.ref = "retrofitKotlinxSerialization" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-logging = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerializationJson" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-guava = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-guava", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-play-services = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-play-services", version.ref = "kotlinxCoroutines" }

junit = { group = "junit", name = "junit", version.ref = "junit" }
# 인터셉터·Authenticator 검증용. okhttp 와 버전을 맞춰야 한다.
okhttp-mockwebserver = { group = "com.squareup.okhttp3", name = "mockwebserver", version.ref = "okhttp" }
kotlin-test = { group = "org.jetbrains.kotlin", name = "kotlin-test", version.ref = "kotlinTest" }

# 인증. BOM이 firebase-* 버전을 맞추므로 개별 라이브러리에는 버전을 적지 않는다.
firebase-bom = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebaseBom" }
firebase-auth = { group = "com.google.firebase", name = "firebase-auth" }

firebase-appcheck = { group = "com.google.firebase", name = "firebase-appcheck" }

# App Check — 앱 무결성 증명. 서버가 알약 식별 3경로에서 검증한다.
# playintegrity 는 release 전용, debug 는 debug 전용으로 갈라 넣는다.
# 둘을 한 APK 에 같이 넣으면 등록된 디버그 토큰만으로 통과할 수 있어 무력화된다.
firebase-appcheck-playintegrity = { group = "com.google.firebase", name = "firebase-appcheck-playintegrity" }
firebase-appcheck-debug = { group = "com.google.firebase", name = "firebase-appcheck-debug" }

# 크래시·지표 (NM-466). 식별자 계약은 spec `feature/auth/README.md` §지표·크래시 식별자 (NM-461).
# ndk 변형이라야 네이티브 크래시를 심볼과 함께 올린다 — ONNX Runtime 이 죽으면 그쪽에서 죽는다.
firebase-crashlytics-ndk = { group = "com.google.firebase", name = "firebase-crashlytics-ndk" }
firebase-analytics = { group = "com.google.firebase", name = "firebase-analytics" }

# 원격 제어 — 강제 업데이트·점검 모드. iOS `RemoteConfigService.swift` 와 같은 키를 쓴다.
firebase-config = { group = "com.google.firebase", name = "firebase-config" }

# 구글 로그인. GoogleSignIn(play-services-auth)은 2025년 지원 종료라 Credential Manager를 쓴다.
androidx-credentials = { group = "androidx.credentials", name = "credentials", version.ref = "androidxCredentials" }
androidx-credentials-play-services-auth = { group = "androidx.credentials", name = "credentials-play-services-auth", version.ref = "androidxCredentials" }
googleid = { group = "com.google.android.libraries.identity.googleid", name = "googleid", version.ref = "googleid" }

# 카카오 로그인. Firebase 비네이티브라 서버가 Custom Token 으로 바꿔 준다.
# v2-user 만 넣는다 — v2-all 은 톡·스토리·내비까지 딸려 온다.
kakao-user = { group = "com.kakao.sdk", name = "v2-user", version.ref = "kakaoSdk" }

# 낱알 이미지. 네트워크는 OkHttp 로 갈아 끼워 인터셉터 없는 클라이언트를 쓴다.
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
coil-network-okhttp = { group = "io.coil-kt.coil3", name = "coil-network-okhttp", version.ref = "coil" }

# 온디바이스 추론 런타임. 프리빌트 배포본이며 EP는 CPU만 쓴다.
# (WebGPU EP는 소스 빌드에만 들어 있다 — NM-396 스파이크 참조)
onnxruntime-android = { group = "com.microsoft.onnxruntime", name = "onnxruntime-android", version.ref = "onnxruntime" }
# 각인 OCR 전처리(NM-485). 기준 구현(ML `infer.py`)이 OpenCV 라 같은 라이브러리를 쓴다 —
# CLAHE·형태학·연결요소를 손으로 옮기면 수치가 갈려도 조용히 틀린다.
opencv = { group = "org.opencv", name = "opencv", version.ref = "opencv" }
androidx-exifinterface = { group = "androidx.exifinterface", name = "exifinterface", version.ref = "androidxExifInterface" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
google-services = { id = "com.google.gms.google-services", version.ref = "googleServices" }
firebase-crashlytics = { id = "com.google.firebase.crashlytics", version.ref = "firebaseCrashlyticsPlugin" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }

# 이 프로젝트가 정의하는 convention 플러그인
nursemate-android-application = { id = "nursemate.android.application" }
nursemate-android-application-compose = { id = "nursemate.android.application.compose" }
nursemate-android-library = { id = "nursemate.android.library" }
nursemate-android-library-compose = { id = "nursemate.android.library.compose" }
nursemate-jvm-library = { id = "nursemate.jvm.library" }
nursemate-hilt = { id = "nursemate.hilt" }
